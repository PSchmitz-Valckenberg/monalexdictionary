<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{% block meta_description %}{{ default_meta_description }}{% endblock %}">
    <meta name="theme-color" content="#c8102e">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="{{ app_name }}">
    <meta property="og:title" content="{% block og_title %}{{ app_name }}{% endblock %}">
    <meta property="og:description" content="{{ self.meta_description() }}">
    <meta property="og:url" content="{{ site_url or request.url }}">
    <meta name="twitter:card" content="summary">
    <title>{% block title %}Monalex{% endblock %}</title>
    <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
    <link rel="manifest" href="{{ url_for('static', filename='site.webmanifest') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    {% block head %}{% endblock %}
</head>
<body>
    <a href="#main-content" class="skip-link">Aller au contenu</a>
    <header class="site-header">
        <div class="site-header__inner">
            <a class="brand" href="{{ url_for('home') }}" aria-label="Monalex accueil">
                <span class="brand__mark">M</span>
                <span>
                    <span class="brand__name">Monalex</span>
                    <span class="brand__tagline">Dictionnaire français-monégasque</span>
                </span>
            </a>
            <nav class="site-nav" aria-label="Navigation principale">
            <ul>
                <li>
                    <a href="{{ url_for('home') }}" {% if current_endpoint == 'home' %}aria-current="page"{% endif %}>Accueil</a>
                </li>
                <li>
                    <a href="{{ url_for('search') }}" {% if current_endpoint in ['search', 'api_search'] %}aria-current="page"{% endif %}>Recherche</a>
                </li>
                <li>
                    <a href="{{ url_for('conjugaison') }}" {% if current_endpoint in ['conjugaison', 'premier', 'deuxieme', 'troisieme', 'etre_conjugation', 'avoir_conjugation', 'exceptions_premier', 'exceptions_deuxieme'] %}aria-current="page"{% endif %}>Conjugaison</a>
                </li>
            </ul>
            </nav>
        </div>
    </header>
    <main id="main-content" class="page-shell" tabindex="-1">
        {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
        <p>&copy; 2026 Monalex. Dictionnaire français-monégasque.</p>
    </footer>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
