<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Monalex</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    {% block head %}{% endblock %}
</head>
<body>
    <header class="site-header">
        <div class="site-header__inner">
            <a class="brand" href="{{ url_for('home') }}" aria-label="Monalex accueil">
                <span class="brand__mark">M</span>
                <span>
                    <span class="brand__name">Monalex</span>
                    <span class="brand__tagline">Dictionnaire français-monégasque</span>
                </span>
            </a>
            <nav class="site-nav" aria-label="Navigation principale">
            <ul>
                <li><a href="{{ url_for('home') }}">Accueil</a></li>
                <li><a href="{{ url_for('search') }}">Recherche</a></li>
                <li><a href="{{ url_for('conjugaison') }}">Conjugaison</a></li>
            </ul>
            </nav>
        </div>
    </header>
    <main class="page-shell">
        {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
        <p>&copy; 2026 Monalex. Dictionnaire français-monégasque.</p>
    </footer>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
