{% extends 'base.html' %}

{% block content %}
    <section class="home-intro">
        <p class="eyebrow">Monaco linguistique</p>
        <h1>Monalex</h1>
        <p>Explorez le riche patrimoine linguistique de Monaco et apprenez des mots et des phrases en monégasque.</p>
        <div class="home-actions">
            <a href="{{ url_for('search') }}" class="monaco-button">Rechercher</a>
            <a href="{{ url_for('conjugaison') }}" class="secondary-button">Conjugaison</a>
        </div>
    </section>

    <section class="history-section">
        <h2>Histoire de la langue</h2>
        <img class="content-image" src="{{ url_for('static', filename='Histoire.png') }}" alt="Histoire de la langue monégasque">
    </section>
{% endblock %}
